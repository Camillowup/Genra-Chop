name: Build GENRA CHOP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Download Rack SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://vcvrack.com/downloads/Rack-SDK-latest-win-x64.zip -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make zip tar zstd sed
            mingw-w64-x86_64-gcc

      - name: Test the engines (without Rack)
        run: |
          g++ -std=c++11 -O2 -D_USE_MATH_DEFINES -Isrc test/hh_test.cpp src/hh/Core.cpp src/hh/Styles.cpp src/hh/Chop.cpp src/hh/Song.cpp src/hh/Break.cpp -o hht.exe
          ./hht.exe
          g++ -std=c++11 -O2 -D_USE_MATH_DEFINES -Isrc test/fx_test.cpp src/fx/FxEngine.cpp -o fxt.exe
          ./fxt.exe

      - name: Build
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          echo "Version $VER"
          make RACK_DIR=sdk/Rack-SDK SLUG=GenraChop VERSION=$VER -j4 dist

      - name: Check the package
        run: |
          D=dist/GenraChop
          ls -la $D $D/res
          test -f $D/plugin.dll
          test -f $D/res/GenraChop.svg
          test -f $D/res/ChopFx.svg
          test -f $D/res/ChopBreak.svg
          test -f $D/res/HHKnob.svg
          test -f $D/licenses/RubberBand-COPYING.txt
          if objdump -p $D/plugin.dll | grep -iE "libstdc"; then echo "plugin.dll loads libstdc++"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: genra-chop-windows
          path: dist/*.vcvplugin

  # macOS (Apple silicon and Intel): only by hand (Actions › Run workflow), GitHub has few Mac runners.
  mac:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Download Rack SDK
        run: |
          curl -sSL -o sdk.zip https://vcvrack.com/downloads/Rack-SDK-latest-mac-${{ matrix.arch }}.zip
          mkdir sdk && cd sdk && unzip -q ../sdk.zip

      - name: Compiler
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            echo "CC=clang -arch x86_64" >> $GITHUB_ENV
            echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
          fi
          brew install zstd || true

      - name: Build
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          make RACK_DIR=$GITHUB_WORKSPACE/sdk/Rack-SDK SLUG=GenraChop VERSION=$VER -j4 dist
          ls dist/*.vcvplugin

      - uses: actions/upload-artifact@v4
        with:
          name: genra-chop-mac-${{ matrix.arch }}
          path: dist/*.vcvplugin
